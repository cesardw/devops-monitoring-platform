services:

  app:
    build:
      context: ./app
    container_name: devops-app
    restart: unless-stopped
    expose: #le indica a Docker que el contenedor escucha en el puerto 3000 para otros contenedores en la misma red interna (Ndevops-network)
      - "3000"
      #port: - "3000:3000" se cambio por expose, esto ayuda en seguridad 
      #la applicacion Node.js evita que salga directo a internet y se obliga a pasar por Nginx.

    environment:
      NODE_ENV: production
      APP_VERSION: "1.1.0"

    networks:
      - devops-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
#logging se puso a cada servicio para limitar que cada contenedor un maximo de 3 archivos de 10mb
#esto lo hice porque se me lleno el disco de mi EC2 y no me dejaba arrancar Docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:1.27-alpine
    container_name: devops-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - devops-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: devops-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - devops-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  grafana:
    image: grafana/grafana:11.2.0
    container_name: devops-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      #lo quite porque ya lo tengo en el .env
      #GF_SECURITY_ADMIN_USER: admin
      #GF_SECURITY_ADMIN_PASSWORD: admin

    networks:
      - devops-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: devops-node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    networks:
      - devops-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:

  devops-network:
    driver: bridge

volumes:
  grafana-data: