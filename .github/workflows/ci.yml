name: CI

on:
  push:
    branches:
      - main
      - feature/hardening-ci-cd
  pull_request:
    branches:
      - main

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:

  security-and-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # <--- CORRECCIÓN: Descarga todo el historial para que Gitleaks pueda escanear en Pull Requests

      # Agregar Gitleaks: este sirve para escanear vulnerabilidades en el código fuente por ejemplo tokens o credenciales expuestas en el codigo fuente. 
      # Se puede agregar como un paso en el flujo de trabajo de CI para escanear el código antes de que se realice un despliegue o una fusión de cambio
      - name: Deteccion de secrets expuestos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Configuracion Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./app/package-lock.json"

      - name: Instalar dependencies
        run: |
          cd app
          npm ci

      - name: Auditoria de Seguridad en Dependencias
        run: |
          cd app
          npm audit --audit-level=high --if-present

  build-and-scan:
    needs: security-and-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build de Docker (Sin Cache para actualizar dependencias)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: devops-app:test
          no-cache: true

      # Escaneo de imagenes de Docker con Trivy: este paso se encarga de escanear la imagen de Docker construida para detectar vulnerabilidades de seguridad 
      # en las imagenes y contenedores de Docker  
      - name: Escaneo de vulnerabilidades en la Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-app:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true # esto evita que falle el flujo de trabajo si se detectan vulnerabilidades que no tienen una solución disponible
          severity: 'CRITICAL'

      - name: Validar sintaxis de Docker Compose
        run: docker compose config