global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram'

receivers:
- name: 'telegram'
  telegram_configs:
  - bot_token: '8947378981:AAELu7DMbTSh4n_qQYL6QYbci9A8JUkaPKY'
    chat_id: 7273472962
    parse_mode: 'HTML'
    message: |
      <b>Alertmanager - Alerta {{ .Status | toUpper }}</b>

      {{ range .Alerts }}
      <b>Alerta:</b> {{ .Labels.alertname }}
      <b>Severidad:</b> {{ .Labels.severity }}
      <b>Resumen:</b> {{ .Annotations.summary }}
      <b>Descripción:</b> {{ .Annotations.description }}
      {{ end }}