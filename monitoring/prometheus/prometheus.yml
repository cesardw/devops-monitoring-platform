global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "nodejs-app" #nuevo job para la aplicación Node.js
    metrics_path: "/metrics" #ruta donde se exponen las métricas
    static_configs:
      - targets:
          - "app:3000" #nombre del servicio de la app en el docker-compose